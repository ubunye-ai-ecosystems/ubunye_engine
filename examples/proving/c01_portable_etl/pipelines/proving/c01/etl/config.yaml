MODEL: etl
VERSION: "1.0.0"

# C01, the first proving workload: one portable (Narwhals) transform, run unchanged
# on pandas, local Spark and the clouds. Where the data lives is a variable, so a
# cloud run points it at object storage without touching this file:
#   --var data_dir=s3://bucket/c01/data --var out_dir=s3://bucket/c01/out
CONFIG:
  inputs:
    orders:
      format: s3
      path: "{{ data_dir | default(task_dir ~ '/../../../../data') }}/orders.csv"
      file_format: csv
      options:
        header: "true"
        inferSchema: "true"
    customers:
      format: s3
      path: "{{ data_dir | default(task_dir ~ '/../../../../data') }}/customers.csv"
      file_format: csv
      options:
        header: "true"
        inferSchema: "true"
  transform: {}
  outputs:
    order_lines:
      format: s3
      path: "{{ out_dir | default(task_dir ~ '/../../../../output') }}/order_lines"
      file_format: parquet
      mode: overwrite
    country_summary:
      format: s3
      path: "{{ out_dir | default(task_dir ~ '/../../../../output') }}/country_summary"
      file_format: parquet
      mode: overwrite
