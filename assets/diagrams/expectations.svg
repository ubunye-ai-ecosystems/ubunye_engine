<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-label="Rows from the transform pass expectation rules before anything is written. Good rows are written; quarantine rows go to a quarantine output with the rules they broke; warn rows stay and the breach is logged; a fail rule stops the run and nothing is written. Reconcile fails a run that loses rows between input and output, and too high a quarantine rate stops the run.">
