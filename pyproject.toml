[build-system]
# 77 is the first setuptools that reads an SPDX `license` expression (PEP 639).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubunye-engine"
version = "0.5.0"
description = "Config-first, backend-neutral data and ML pipelines that you can check on a laptop and prove anywhere"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="Thabang Mashinini-Sekgoto", email="thabangline@gmail.com"}]
maintainers = [{name="Ubunye AI Ecosystems"}]
keywords = [
  "spark", "pyspark", "pandas", "databricks", "etl", "mlops", "data-pipelines",
  "machine-learning", "config-driven", "reproducibility", "lineage", "kubernetes",
]
# Only the Python versions CI tests are listed. No licence classifier: the SPDX
# expression above is the licence, and setuptools refuses both.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6",
  "jinja2>=3",
  "pydantic>=2",
  "typer>=0.15.4",
  # pyspark is large; declare as optional so users can choose version
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
# Delta Lake. Needed to exercise mode: merge / replace_where against a real
# Delta table; the integration tests skip cleanly without it. Databricks ships
# Delta in the runtime, so this is a local/CI concern only.
#
# delta-spark is tied to a Spark major: 3.x needs Spark 3.x, 4.x needs Spark 4.x.
# `spark` is unpinned above and resolves to pyspark 4.x today, so pair it with
# delta-spark 4.x — a 3.x delta against Spark 4 fails at runtime with
# ClassNotFoundException: delta.DefaultSource, not at install time.
delta = ["delta-spark>=4.0"]
# The pandas backend — `ubunye run --backend pandas`, a laptop run with no Spark and
# no JVM (issue #38). pyarrow does the file IO and backs the columns, so types
# match Spark's (a nullable int stays an int). pandas 2.2 is the first with the
# Arrow-backed reads it relies on.
# pyarrow before 24 cannot find a timezone database on Windows, so every
# timestamp would fail there; Windows asks for 24.
pandas = [
  "pandas>=2.2",
  "pyarrow>=14; platform_system != 'Windows'",
  "pyarrow>=24; platform_system == 'Windows'",
]
ml = ["scikit-learn", "mlflow"]
ml-torch = ["scikit-learn", "torch", "mlflow"]
# The rest_api connector needs `requests`. It used to live ONLY in the dev extra, so
# `pip install ubunye-engine[spark]` shipped a reader that could not make a request.
# Nobody noticed because Databricks preinstalls requests -- the bug was invisible from
# the one platform most people used, and appeared the moment anyone left it.
rest = ["requests>=2.28"]
# Model artifacts on object storage (s3://, gs://, ...). fsspec routes the scheme to
# whichever filesystem package is installed: add s3fs for AWS, gcsfs for GCP.
objectstore = ["fsspec>=2023.1.0"]
# pandas and pyarrow are here so the pandas backend is tested on every CI run, not
# skipped; without pyarrow the parquet tests failed instead of skipping.
dev = ["pytest", "pytest-cov>=4", "pytest-timeout", "hypothesis>=6", "requests>=2.28", "black", "ruff", "build", "mypy>=1.8", "pandas>=2.2", "pyarrow>=14; platform_system != 'Windows'", "pyarrow>=24; platform_system == 'Windows'", "narwhals>=2"]
databricks = ["databricks-sdk>=0.20"]

# Project URLs. These populate the sidebar links on the PyPI page, which
# otherwise shows none, so anyone finding the package can reach the docs, the
# source and the author's site. Updated on the next release.
[project.urls]
Homepage = "https://www.tmashininisekgoto.com"
Documentation = "https://ubunye-ai-ecosystems.github.io/ubunye_engine/"
Repository = "https://github.com/ubunye-ai-ecosystems/ubunye_engine"
Issues = "https://github.com/ubunye-ai-ecosystems/ubunye_engine/issues"
"Project page" = "https://www.tmashininisekgoto.com/work/ubunye-engine"

[project.scripts]
ubunye = "ubunye.cli.main:main"

# Execution backends (ADR 001). The shipped ones register exactly as a third
# party engine would; `ubunye run --backend <name>` picks one by this name.
[project.entry-points."ubunye.backends"]
spark = "ubunye.backends.spark_backend:SparkBackend"
databricks = "ubunye.backends.databricks_backend:DatabricksBackend"
pandas = "ubunye.backends.pandas_backend:PandasBackend"

[project.entry-points."ubunye.readers"]
hive = "ubunye.plugins.readers.hive:HiveReader"
jdbc = "ubunye.plugins.readers.jdbc:JdbcReader"
s3 = "ubunye.plugins.readers.s3:S3Reader"
delta = "ubunye.plugins.readers.delta:DeltaReader"
binary = "ubunye.plugins.readers.binary:BinaryReader"
unity = "ubunye.plugins.readers.unity:UnityTableReader"
rest_api = "ubunye.plugins.readers.rest_api:RestApiReader"

[project.entry-points."ubunye.writers"]
s3 = "ubunye.plugins.writers.s3:S3Writer"
delta = "ubunye.plugins.writers.delta:DeltaWriter"
hive = "ubunye.plugins.writers.hive:HiveWriter"
jdbc = "ubunye.plugins.writers.jdbc:JdbcWriter"
unity = "ubunye.plugins.writers.unity:UnityTableWriter"
rest_api = "ubunye.plugins.writers.rest_api:RestApiWriter"
# No binary writer: Spark's binaryFile source is read-only. 'binary' in
# CONFIG.outputs is rejected at config load (see config/schema.py).

[project.entry-points."ubunye.transforms"]
noop  = "ubunye.plugins.transforms.noop:NoOpTransform"
model = "ubunye.plugins.transforms.model_transform:ModelTransform"

[project.entry-points."ubunye.ml"]
sklearn = "ubunye.plugins.ml.sklearn:SklearnModel"
sparkml = "ubunye.plugins.ml.pysparkml:SparkMLModel"

[project.entry-points."ubunye.monitors"]
mlflow  = "ubunye.telemetry.mlflow:MLflowMonitor"
lineage = "ubunye.lineage.recorder:LineageRecorder"

[project.entry-points."ubunye.hooks"]
events     = "ubunye.telemetry.hooks.events:EventLoggerHook"
otel       = "ubunye.telemetry.hooks.otel:OTelHook"
prometheus = "ubunye.telemetry.hooks.prometheus:PrometheusHook"

[project.entry-points."ubunye.deploy_adapters"]
databricks = "ubunye.deploy.databricks:DatabricksDeployAdapter"

[project.entry-points."ubunye.artifact_stores"]
# Third parties add storage schemes here: `mycloud = "pkg.mod:MyStore"` makes
# `store_path="mycloud://bucket/models"` work with zero engine edits. The class is
# called with the scheme and must satisfy the structural ArtifactStore contract.
file = "ubunye.models.artifact_store:LocalArtifactStore"

[project.entry-points."ubunye.registry_backends"]
filesystem = "ubunye.models.registry:FilesystemRegistryBackend"
mlflow = "ubunye.models.mlflow_registry:MLflowRegistryBackend"

[project.entry-points."ubunye.lineage_backends"]
filesystem = "ubunye.lineage.storage:FileSystemLineageStore"
delta = "ubunye.lineage.delta_store:DeltaLineageBackend"

[project.entry-points."ubunye.auth_backends"]
token = "ubunye.deploy.databricks.auth:TokenAuthBackend"
service_principal = "ubunye.deploy.databricks.auth:ServicePrincipalAuthBackend"

[tool.setuptools.packages.find]
include = ["ubunye*"]

[tool.setuptools.package-data]
# The marker that makes the annotations REAL for consumers. Without it, PEP 561 says
# type checkers must ignore this package entirely — so every annotation in the engine
# was invisible to anyone who installed it.
ubunye = ["py.typed"]

[tool.mypy]
python_version = "3.10"  # the oldest Python the package supports
ignore_missing_imports = true   # pyspark, delta and mlflow ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# The floor, not the ceiling: existing untyped defs stay legal for now, but what IS
# annotated must be correct, and CI holds the line so it can only improve.
check_untyped_defs = false

[[tool.mypy.overrides]]
# The databricks-sdk is an optional extra. With it installed, its stubs make one
# `type: ignore[arg-type]` necessary; without it, the same ignore is "unused" and
# warn_unused_ignores fails the build. An ignore whose validity depends on which
# optional packages happen to be installed cannot satisfy both environments, so this
# module opts out of the unused-ignore check only.
module = "ubunye.deploy.databricks.*"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a local Spark session and Java 11",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
  "E501",   # line too long — handled by Black; long help strings in CLI are acceptable
]
