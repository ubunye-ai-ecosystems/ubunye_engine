site_name: Ubunye Engine
site_description: Config-first framework for data and ML pipelines. Write a task once, run it on pandas, Spark or Databricks, and prove every run gives the same rows.
site_url: https://ubunye-ai-ecosystems.github.io/ubunye_engine
repo_url: https://github.com/ubunye-ai-ecosystems/ubunye_engine
repo_name: ubunye-ai-ecosystems/ubunye_engine
copyright: "© 2026 Ubunye"

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    # Top-level sections as tabs in the header (desktop). The sidebar then lists
    # the pages of the open tab. On mobile the tabs fold into the drawer.
    - navigation.tabs
    - navigation.tabs.sticky
    # Deliberately NOT set:
    #   navigation.sections - renders sections as flat, always-open groups
    #   navigation.expand   - force-expands everything, so nothing can collapse
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  # Colours come from the diagrams (dark stage #1c1d22, orange, teal, purple,
  # light blue). "custom" hands them to docs/stylesheets/extra.css.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/ubunye-logo-black-v3.png
  favicon: assets/favicon.ico

nav:
  # Grouped by what the reader is trying to DO, in the order they will do it:
  # learn it, write a pipeline, see it working, ship it, look things up.
  - Home: index.md
  - Getting Started:
      - Installation: getting_started/install.md
      - Quickstart: getting_started/quickstart.md
      - Concepts: getting_started/concepts.md
      - Project Structure: getting_started/structure.md
      - "Tutorial 1: pandas and Spark": tutorials/01-local-parity.md
      - "Tutorial 2: nine tables, checked": tutorials/02-olist-multi-table.md
  - Writing Tasks:
      - Config Overview: config/overview.md
      - Inputs and Outputs: config/io.md
      - Engine and Profiles: config/engine.md
      - Transform: config/transform.md
      - Expectations: config/expectations.md
      - Secrets: config/secrets.md
      - Jinja Templating: config/jinja.md
      - Orchestration: config/orchestration.md
  - Connectors:
      - Overview: connectors/overview.md
      - Hive: connectors/hive.md
      - JDBC: connectors/jdbc.md
      - Unity Catalog: connectors/unity.md
      - Files and Delta (s3, delta, binary): connectors/s3.md
      - REST API: connectors/rest_api.md
      - Writing Your Own: connectors/plugin_guide.md
  - Machine Learning:
      - Model Contract: ml/model_contract.md
      - Model Registry: ml/registry.md
  # Examples are grouped by what you are trying to DO. Inside every example a
  # linked toggle (content.tabs.link) switches the run instructions between
  # Databricks, Laptop, Docker and Kubernetes, and remembers the choice site-wide.
  - Examples:
      - Start Here: examples/index.md
      - Ingestion: examples/ingestion.md
      - Machine Learning: examples/ml.md
      - Language Models: examples/llm.md
      - Keeping Models Honest: examples/mlops.md
      - Run Anywhere, Proven: examples/run_anywhere.md
  - Deployment:
      - Overview: deployment.md
      - Databricks: deployment/databricks.md
      - Databricks Authentication: databricks-auth.md
      - Kubernetes: deployment/kubernetes.md
      - AWS: deployment/aws.md
      - GCP: deployment/gcp.md
      - Azure: deployment/azure.md
      - One command to the cloud: deployment/serverless.md
      - Anywhere with spark-submit: deployment/anywhere.md
  - How-to Guides:
      - Run Records: guides/run-records.md
      - Safe Reruns: guides/safe-reruns.md
      - Writing portable transforms: guides/portable-transforms.md
      - Notebook Prototyping: patterns/notebook.md
      - RAG Document Pipeline: patterns/rag.md
      - Feature Store: patterns/features.md
      - Drift Detection: patterns/drift.md
      - REST API Ingestion: patterns/rest_api.md
      - Observability Hooks: patterns/hooks.md
      - OpenLineage: patterns/openlineage.md
      - OpenTelemetry: patterns/opentelemetry.md
      - Gate Pull Requests: patterns/gate.md
      - Job Health and Upstream Checks: patterns/job-health.md
      - Language Model Steps: patterns/llm.md
      - Agents over MCP: patterns/mcp.md
  - Reference:
      - CLI: cli.md
      - Python API: api.md
      - Execution Backends: backends.md
      - Interfaces: interfaces.md
      - Errors: errors.md
      - Troubleshooting: troubleshooting.md
      - Upgrading: upgrading.md
      - Changelog: changelog.md
  - Proving Ground:
      - Overview: proving-ground/index.md
      - Latest results: proving-ground/latest.md
  - Project:
      - Developer Guide: dev_guide.md
      - Architecture Decisions:
          - Overview: architecture/index.md
          - ADR 001 Backends Are Plugins: architecture/adr-001-backends-are-plugins.md
          - ADR 002 Backend Capabilities: architecture/adr-002-backend-capabilities.md
          - ADR 003 Choosing a Backend: architecture/adr-003-backend-resolution.md
          - ADR 004 Native Frames: architecture/adr-004-native-frames.md
          - ADR 005 Portable Transforms: architecture/adr-005-portable-transforms.md
          - ADR 006 The Run Record: architecture/adr-006-run-record.md
          - ADR 007 One Time Zone: architecture/adr-007-one-time-zone.md
          - ADR 008 Rerun Safety: architecture/adr-008-rerun-safety.md
          - ADR 009 Compute Outputs Once: architecture/adr-009-compute-outputs-once.md
          - ADR 010 Registry Backends: architecture/adr-010-registry-backends.md
          - ADR 011 Run Record Stores: architecture/adr-011-run-record-stores.md
          - ADR 012 Model Runs and Features: architecture/adr-012-model-runs-and-feature-contract.md
          - ADR 013 Receipt Queries: architecture/adr-013-receipt-queries.md
          - ADR 014 MLflow Registry Aliases: architecture/adr-014-mlflow-registry-aliases.md
          - ADR 015 Run Identity and Job Settings: architecture/adr-015-run-identity-and-job-settings.md
          - ADR 016 Notebook As A Run: architecture/adr-016-notebook-as-a-run.md
      - Contributing: contributing.md

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # base_path is the repo root so docs/examples/*.md can include the real
  # example READMEs with `--8<-- "examples/..."` instead of copying them.
  # A copy would drift the first time someone edits an example.
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  # - pymdownx.emoji:
  #     emoji_index: !!python/name:material.extensions.emoji.twemoji
  #     emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # Tap or click an image to see it full screen. Off for images marked
  # { .off-glb }.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - off-glb
  # Link preview cards (the picture shown when a page is shared). Needs
  # cairosvg, pillow and the system libcairo, so it is off here and the docs
  # workflow switches it on (it rewrites the line marked "social-cards").
  - social:
      enabled: false # social-cards
      cards_layout_options:
        # Light blue from the diagrams, so the black logo stays visible.
        background_color: "#cdeefb"
        color: "#1c1d22"
  - macros:
      on_error_fail: false
      j2_block_start_string: "[%"
      j2_block_end_string: "%]"
      j2_variable_start_string: "[["
      j2_variable_end_string: "]]"
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            separate_signature: true
            show_root_toc_entry: false

extra_css:
  - stylesheets/palette.css
  - stylesheets/extra.css
  - stylesheets/home.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ubunye-ai-ecosystems/ubunye_engine
