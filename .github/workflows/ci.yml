name: ci

on: [push, pull_request]

jobs:
  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e .[dev]
      - name: mypy
        # The package ships py.typed, so these annotations are a public API now.
        # This job is what keeps them true.
        run: python -m mypy ubunye

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -U pip
      - run: pip install -e .[dev]
      - run: |
          pytest tests/unit/ -v --tb=short -m "not integration" \
            --cov=ubunye --cov-report=term-missing --cov-report=xml
