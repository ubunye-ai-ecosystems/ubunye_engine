name: ci

on: [push, pull_request]

jobs:
  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e .[dev]
      - name: mypy
        # The package ships py.typed, so these annotations are a public API now.
        # This job is what keeps them true.
        run: python -m mypy ubunye

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -U pip
      - run: pip install -e .[dev]
      - run: |
          pytest tests/unit/ -v --tb=short -m "not integration" \
            --cov=ubunye --cov-report=term-missing --cov-report=xml

  package:
    # What a user gets from PyPI: the wheel, installed alone in a clean venv.
    # A backend's missing packages must be named, not crash; with the pandas
    # extra, a real task must run with no Java. Linux and Windows.
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and check the distributions
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel alone in a clean venv
        run: |
          python -m venv clean
          if [ -f clean/bin/python ]; then BIN="$PWD/clean/bin"; else BIN="$PWD/clean/Scripts"; fi
          echo "PY=$BIN/python" >> "$GITHUB_ENV"
          echo "UBUNYE=$BIN/ubunye" >> "$GITHUB_ENV"
      - name: The bare install lists backends and names what is missing
        run: |
          "$PY" -m pip install dist/*.whl
          "$UBUNYE" --help > /dev/null
          "$UBUNYE" backends --json | "$PY" -c "import json,sys; rows={r['name']: r for r in json.load(sys.stdin)}; assert not rows['pandas']['loaded'] and 'ubunye-engine[pandas]' in rows['pandas']['error'], rows"
      - name: With the pandas extra, a task runs with no Java
        run: |
          WHEEL=$(ls dist/*.whl)
          "$PY" -m pip install "${WHEEL}[pandas]"
          mkdir -p smoke/uc/pkg/copy
          printf 'id,city\n1,jhb\n2,cpt\n' > smoke/in.csv
          printf 'from ubunye.core.interfaces import Task\n\n\nclass Copy(Task):\n    def transform(self, sources):\n        return {"out": sources["src"]}\n' > smoke/uc/pkg/copy/transformations.py
          printf 'MODEL: etl\nVERSION: "1.0.0"\nCONFIG:\n  inputs:\n    src:\n      format: s3\n      path: "in.csv"\n      file_format: csv\n      options:\n        header: "true"\n  transform: {}\n  outputs:\n    out:\n      format: s3\n      path: "out"\n      file_format: parquet\n      mode: overwrite\n' > smoke/uc/pkg/copy/config.yaml
          cd smoke
          "$UBUNYE" run -d . -u uc -p pkg -t copy --backend pandas --lineage
          test -f out/_SUCCESS
          "$UBUNYE" lineage list -d . -u uc -p pkg -t copy | grep success
