name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit:
    # Every Python the package supports, on the three systems people run it on.
    # The unit tier needs no Java: the pandas backend covers the engine end to end.
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        # Windows runners default to PowerShell, which cannot read the steps'
        # bash line continuations.
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -m "not integration" \
            --cov=ubunye --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  minimum-versions:
    # The oldest versions pyproject.toml accepts, installed exactly. A floor that
    # does not work is a promise the package breaks for whoever has that version.
    # Keep these pins equal to the floors in pyproject.toml.
    name: Unit Tests (minimum versions, Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install the package, then its floors
        # numpy<2: pandas 2.2.0 and pyarrow 14 were built before numpy 2.
        run: |
          pip install -e ".[dev]"
          pip install "pyyaml==6.0" "jinja2==3.0.0" "pydantic==2.0" "typer==0.15.4" "narwhals==2.0.0" \
            "pandas==2.2.0" "pyarrow==14.0.0" "numpy<2"
          # The mcp extra needs pydantic 2.12; its tests skip without it.
          pip uninstall -y mcp
          pip list | grep -iE "^(pyyaml|jinja2|pydantic|typer|narwhals|pandas|pyarrow|numpy) "

      - name: Run unit tests
        run: pytest tests/unit/ --tb=short -m "not integration"

  integration:
    # Spark 4 on the oldest and the newest supported Python, each with a Java it
    # runs on, and the oldest Spark the `spark` extra accepts (3.5, with the
    # Delta release built for it). Keep the 3.5 pin equal to that floor.
    name: Integration Tests (Spark ${{ matrix.spark }}, Python ${{ matrix.python-version }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "4"
            python-version: "3.10"
            java: "17"
            install: '".[dev,spark,delta]"'
          - spark: "4"
            python-version: "3.13"
            java: "21"
            install: '".[dev,spark,delta]"'
          - spark: "3.5"
            python-version: "3.11"
            java: "11"
            install: '".[dev]" "pyspark==3.5.*" "delta-spark==3.2.*"'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install dependencies (with Spark + Delta)
        run: pip install -e ${{ matrix.install }}

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short -m integration \
            --timeout=300

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev tools
        # The versions .pre-commit-config.yaml pins, so CI and the hooks agree.
        run: pip install "ruff==0.16.8" "black==26.5.1"

      - name: Run ruff
        run: ruff check ubunye/ tests/

      - name: Check black formatting
        run: black --check --diff ubunye/ tests/
