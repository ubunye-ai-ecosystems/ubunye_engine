name: docs

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "ubunye/**"
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # full history — required by git-revision-date-localized
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system libraries for link preview cards
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Install docs deps
        run: |
          python -m pip install -U pip
          pip install -r docs/requirements.txt
          pip install -e .
      - name: Build
        run: |
          # Switch on the link preview cards (off for local builds).
          sed -i 's/enabled: false # social-cards/enabled: true # social-cards/' mkdocs.yml
          grep -q "enabled: true # social-cards" mkdocs.yml
          mkdocs build --strict
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
