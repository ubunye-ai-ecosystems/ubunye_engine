name: Publish to PyPI

on:
  push:
    tags:
      - 'v*' # a hand-pushed version tag still works
  release:
    types: [published]
    # Releases are now created automatically when the version in pyproject.toml
    # changes on main (see release_on_version_bump.yml). A tag created through the
    # release API does not reliably fire a tag push event, so listen for the release
    # itself as well. The pypip environment still requires a human approval, so
    # nothing reaches PyPI without a click.

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    environment: pypip         # protects releases with an approval gate
                               # (must match the env name on the PyPI Trusted
                               # Publisher entry exactly - case-sensitive)
    permissions:
      contents: read
      id-token: write          # required for OIDC Trusted Publishers
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build binary wheel and source tarball
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true