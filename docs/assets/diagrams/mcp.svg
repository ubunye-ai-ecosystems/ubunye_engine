<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="ubunye mcp serves the engine to any MCP client. Tasks, doctor, plan, runs, record, gate, focus, health and upstream only read. The run tool exists only with --allow-run. Tasks are named, never given as paths, so ../../etc is refused.">
