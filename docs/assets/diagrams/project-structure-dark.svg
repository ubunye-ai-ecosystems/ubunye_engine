<text x="66" y="300" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#111318" text-anchor="middle">-p</text>
<text x="102" y="300" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3dd6c3" text-anchor="start" letter-spacing="1.5">PIPELINE</text>
<text x="44" y="340" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="700" fill="#e5e7eb" text-anchor="start">ingestion/</text>
<text x="44" y="368" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#a3abb8" text-anchor="start">Runs its tasks in order, one after another.</text>
<rect x="44" y="410" width="180" height="44" rx="10" fill="#1e2129" stroke="#ff9d5c" stroke-width="2.5"/><text x="134.0" y="439" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#e5e7eb" text-anchor="middle">claim_etl</text>
<text x="48" y="402" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a3abb8" text-anchor="start">step 1</text>
