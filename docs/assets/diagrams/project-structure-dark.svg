<text x="62" y="678" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">config.yaml</text>
<text x="62" y="708" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#a3abb8" text-anchor="start" xml:space="preserve">inputs:   where to read</text>
<text x="62" y="730" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#a3abb8" text-anchor="start" xml:space="preserve">outputs:  where to write</text>
<line x1="62" y1="752" x2="334.0" y2="752" stroke="#ff9d5c" stroke-opacity="0.25"/>
<text x="62" y="776" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#ff9d5c" font-weight="700">WHAT</tspan><tspan fill="#e5e7eb" font-weight="400">  to read and write</tspan></text>
<rect x="368.0" y="646" width="308.0" height="150" rx="12" fill="#1e2129" stroke="#ff9d5c" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="386.0" y="678" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">transformations.py</text>
<text x="386.0" y="708" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#a3abb8" text-anchor="start" xml:space="preserve">class ClaimEtl(Task):</text>
<text x="386.0" y="730" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#a3abb8" text-anchor="start" xml:space="preserve">    def transform(...)</text>
<line x1="386.0" y1="752" x2="658.0" y2="752" stroke="#ff9d5c" stroke-opacity="0.25"/>
<text x="386.0" y="776" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#ff9d5c" font-weight="700">HOW</tspan><tspan fill="#e5e7eb" font-weight="400">  to change the data</tspan></text>
<rect x="20" y="846" width="680" height="206" rx="16" fill="#1e2129" stroke="#a3abb8" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="44" y="878" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#a3abb8" text-anchor="start" letter-spacing="1.5">ONE ADDRESS, TWO WAYS TO WRITE IT</text>
<text x="44" y="910" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3abb8" text-anchor="start">the folder</text>
<text x="44" y="934" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" text-anchor="start" xml:space="preserve"><tspan fill="#a3abb8" font-weight="400">pipelines/</tspan><tspan fill="#b49cff" font-weight="700">fraud_detection/</tspan><tspan fill="#3dd6c3" font-weight="700">ingestion/</tspan><tspan fill="#ff9d5c" font-weight="700">claim_etl/</tspan></text>
<text x="44" y="968" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3abb8" text-anchor="start">the command</text>
<text x="44" y="992" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" text-anchor="start" xml:space="preserve"><tspan fill="#e5e7eb" font-weight="400">ubunye run </tspan><tspan fill="#a3abb8" font-weight="400">-d pipelines</tspan></text>
<text x="88" y="1020" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" text-anchor="start" xml:space="preserve"><tspan fill="#b49cff" font-weight="700">-u fraud_detection </tspan><tspan fill="#3dd6c3" font-weight="700">-p ingestion </tspan><tspan fill="#ff9d5c" font-weight="700">-t claim_etl</tspan></text>
</svg>
