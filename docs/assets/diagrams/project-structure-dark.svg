<rect x="264" y="152" width="200" height="44" rx="10" fill="#1e2129" stroke="#3dd6c3" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 5"/><text x="364.0" y="181" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#a3abb8" text-anchor="middle">scoring</text>
<polygon points="44,196 244,196 700,260 20,260" fill="#3dd6c3" fill-opacity="0.08"/><line x1="44" y1="196" x2="20" y2="260" stroke="#3dd6c3" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="244" y1="196" x2="700" y2="260" stroke="#3dd6c3" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="20" y="260" width="680" height="214" rx="16" fill="#3dd6c3" fill-opacity="0.12" stroke="#3dd6c3" stroke-width="2"/>
