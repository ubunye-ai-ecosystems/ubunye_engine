<rect x="20" y="518" width="680" height="300" rx="16" fill="#ff9d5c" fill-opacity="0.12" stroke="#ff9d5c" stroke-width="2"/>
<rect x="44" y="538" width="44" height="28" rx="14" fill="#ff9d5c"/>
<text x="66" y="558" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#111318" text-anchor="middle">-t</text>
<text x="102" y="558" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ff9d5c" text-anchor="start" letter-spacing="1.5">TASK</text>
<text x="44" y="598" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="700" fill="#e5e7eb" text-anchor="start">claim_etl/</text>
<text x="44" y="626" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#a3abb8" text-anchor="start">One folder, one job: read, transform, write.</text>
