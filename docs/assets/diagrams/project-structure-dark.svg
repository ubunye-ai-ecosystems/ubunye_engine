<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1072" width="720" height="1072" role="img" aria-label="A use case folder holds pipelines; a pipeline runs its tasks in order; a task is a folder with config.yaml and transformations.py. The folder path and the ubunye run flags name the same task.">
<rect x="20" y="20" width="680" height="196" rx="16" fill="#b49cff" fill-opacity="0.12" stroke="#b49cff" stroke-width="2"/>
<rect x="44" y="40" width="44" height="28" rx="14" fill="#b49cff"/>
<text x="66" y="60" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#111318" text-anchor="middle">-u</text>
<text x="102" y="60" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b49cff" text-anchor="start" letter-spacing="1.5">USE CASE</text>
<text x="44" y="100" font-family="'Roboto Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="700" fill="#e5e7eb" text-anchor="start">fraud_detection/</text>
<text x="44" y="128" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#a3abb8" text-anchor="start">A business problem. It holds one or more pipelines.</text>
