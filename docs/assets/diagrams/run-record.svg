<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-label="Every run leaves a receipt: what it read, what it wrote with a row count and a hash of every row, the expectations, where it ran and how long it took, stored in .ubunye/lineage. The hash adds up a hash of each row, so row order does not matter and one changed cell changes it. ubunye gate compares two receipts and fails when the data changed but the task VERSION did not.">
