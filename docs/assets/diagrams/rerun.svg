<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-label="Rerun safety. A batch is a task with its dt; one run per batch holds a lease. Running a finished append again is refused. --rerun writes the batch again and then removes the first run's files. After a crash the next run takes over the lease and removes the dead run's files. --resume skips the tasks of a pipeline that already finished and runs the rest.">
<desc>Logos: Simple Icons (CC0); marks belong to their owners; OpenTelemetry logo CC BY 4.0, the OpenTelemetry Authors.</desc>
